<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maynooth · Mapbox</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23203129'/%3E%3Cpath d='M6 23V9l10 10L26 9v14' fill='none' stroke='%23d9e7b7' stroke-width='3'/%3E%3C/svg%3E"><link href="https://api.mapbox.com/mapbox-gl-js/v3.31.0/mapbox-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#203129;background:#edf0e8}#map{position:absolute;inset:0}.panel{position:absolute;top:20px;left:20px;max-width:360px;background:#fffef8f2;border:1px solid #dce1d5;border-radius:16px;padding:20px;box-shadow:0 8px 32px #20312918}h1{font-size:24px;margin:4px 0 8px;letter-spacing:-.6px}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:2px}p{line-height:1.5;font-size:14px;margin:0 0 16px;color:#637064}.row{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-size:14px;border:1px solid #cad2c4;background:white;color:#203129;border-radius:9px;padding:10px 14px;cursor:pointer}button[aria-pressed=true]{background:#203129;color:white}button:hover{border-color:#203129}#status{margin-top:14px;font-size:13px}#status:empty{display:none}@media(max-width:600px){.panel{top:12px;left:12px;right:60px;padding:14px}h1{font-size:21px}.panel p{display:none}.kicker{font-size:11px}.row{gap:5px}button{padding:9px 11px}}</style></head><body><main id="map" aria-label="Interaktywna mapa Maynooth"></main><section class="panel"><span class="kicker">Podgląd mapy</span><h1>Maynooth</h1><p>Przeciągnij, aby przesunąć mapę. Użyj kółka myszy, aby przybliżyć. Prawy przycisk myszy pozwala obracać widok.</p><div class="row"><button id="three" aria-pressed="true">Widok 3D</button><button id="two" aria-pressed="false">Widok 2D</button><button id="reset">Reset widoku</button></div><div id="status" role="status">Wczytywanie mapy…</div></section><script src="/mapboxtest/config.js"></script><script src="https://api.mapbox.com/mapbox-gl-js/v3.31.0/mapbox-gl.js"></script><script>
const statusEl=document.getElementById('status');
const initial={center:[-6.589854818192919,53.378356815627825],zoom:15.253721136994471,bearing:-12.799999999999955,pitch:54.99999999999997};
try {
const map=new mapboxgl.Map({container:'map',accessToken:window.MAPBOX_TOKEN,style:'mapbox://styles/sapaqi/cmupibf6z007001sk2zawddbg',...initial,antialias:true});
map.addControl(new mapboxgl.NavigationControl(),'top-right');
map.addControl(new mapboxgl.ScaleControl({unit:'metric'}),'bottom-left');
const sync=()=>{const tilted=map.getPitch()>5;document.getElementById('three').setAttribute('aria-pressed',String(tilted));document.getElementById('two').setAttribute('aria-pressed',String(!tilted));};
map.on('load',()=>{statusEl.textContent='';});
map.on('pitchend',sync);
map.on('error',e=>{if(!map.isStyleLoaded())statusEl.textContent='Nie udało się wczytać mapy. Sprawdź połączenie oraz dostęp tokenu do tego adresu strony.';console.error(e.error?.message);});
document.getElementById('three').onclick=()=>map.easeTo({pitch:55,duration:800});
document.getElementById('two').onclick=()=>map.easeTo({pitch:0,bearing:0,duration:800});
document.getElementById('reset').onclick=()=>map.flyTo({...initial,duration:1200});
}catch(e){statusEl.textContent='Mapa wymaga dostępu do internetu i przeglądarki z obsługą WebGL.';}
</script></body></html>
