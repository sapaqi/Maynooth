<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phoenix CU — Vertical story</title>
<style>

}.story-aside p{line-height:1.7;color:var(--muted);font-size:15px}.range{font-size:13px;border-top:1px solid #ccd9da;margin-top:32px;padding-top:22px;display:flex;justify-content:space-between}.mini-track{height:3px;background:#dce7e7;margin-top:16px}.mini-track i{display:block;background:var(--teal);height:100%;width:var(--progress,0%);transition:width .15s}.years-big{font-size:85px;letter-spacing:-6px;color:#d4e5e5;margin-top:24px;font-weight:bold}.events{position:relative;padding-left:38px}.events:before,.events:after{content:'';position:absolute;left:7px;top:26px;width:2px;bottom:80px;background:#d4e1e1}.events:after{background:var(--teal);transform-origin:top;transform:scaleY(var(--p,0));bottom:80px}.event{position:relative;padding:0 0 35px}.event:before{content:'';position:absolute;left:-37px;top:24px;width:12px;height:12px;border:3px solid #f1f7f6;border-radius:50%;background:#b6c9c9;z-index:2;box-shadow:0 0 0 1px #b6c9c9;transition:.5s}.event.seen:before{background:var(--teal);box-shadow:0 0 0 5px #00a6b218}.event-card{border:1px solid #e2e9e9;background:#ffffffbf;border-radius:20px;padding:28px 30px;display:grid;grid-template-columns:105px 1fr;gap:24px;box-shadow:0 8px 25px #24335b03;transition:transform .4s,box-shadow .4s}.event-card:hover{transform:translateY(-4px);box-shadow:0 15px 32px #24335b0c}.date{font-size:37px;letter-spacing:-1.7px;font-weight:bold;line-height:1}.event small{font-size:10px;display:block;letter-spacing:1.2px;text-transform:uppercase;color:#007e89;margin:10px 0 0}.event h3{font-size:21px;letter-spacing:-.4px;margin:0 0 12px}.event p{margin:0;line-height:1.7;color:var(--muted);font-size:14px}.event:last-child .event-card{background:var(--navy);color:white;border-color:var(--navy)}.event:last-child p{color:#d8e2ef}.event:last-child small{color:#74dce0}.event:last-child:before{background:var(--yellow)}.v2{padding:15px 40px 80px;max-width:1240px;margin:auto}.stage{position:relative;isolation:isolate;overflow:hidden;border-radius:28px;background:var(--navy);color:white;padding:54px 58px 32px}.stage:before{content:'';position:absolute;z-index:-1;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,#00a6b24d,transparent 65%);top:-270px;right:-120px;animation:drift 12s ease-in-out infinite alternate}.stage-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:1px;color:#b7dfe3}.live-dot{display:inline-block;width:7px;height:7px;background:var(--yellow);border-radius:50%;margin-right:9px}.slide{display:grid;grid-template-columns:1fr 1fr;gap:65px;align-items:center;min-height:335px;padding:40px 0}.year-art{position:relative;min-height:240px;display:flex;align-items:center;justify-content:center}.year-art:before,.year-art:after{content:'';position:absolute;border:1px solid #ffffff15;width:230px;height:230px;border-radius:50%;transform:translateX(-40px)}.year-art:after{transform:translateX(40px);border-color:#00b5bf60}.giant{font-size:clamp(90px,11vw,158px);font-weight:bold;letter-spacing:-10px;position:relative;z-index:1;color:white}.year-caption{position:absolute;bottom:0;left:0;right:0;text-align:center;text-transform:uppercase;font-size:10px;letter-spacing:3px;color:#78d8dc}.slide-copy .eyebrow{color:#76dce0;margin-bottom:15px}.slide-copy h2{font-size:clamp(27px,3vw,40px);line-height:1.13;letter-spacing:-1px;margin:0 0 20px}.slide-copy p{font-size:16px;line-height:1.75;color:#d5dcec;margin:0;max-width:400px}.slide.animate{animation:enter .42s ease both}.controls{display:flex;align-items:center;justify-content:space-between;padding:12px 0 28px}.controls p{font-size:12px;color:#b8c9df}.arrows{display:flex;gap:8px}.arrow{width:45px;height:45px;border:1px solid #ffffff40;background:transparent;border-radius:50%;color:white;font-size:23px}.arrow:not(:disabled):hover{background:var(--yellow);color:var(--deep);border-color:var(--yellow)}.rail{display:grid;grid-template-columns:repeat(7,1fr);position:relative;border-top:1px solid #ffffff35;gap:0}.rail button{position:relative;background:transparent;border:0;color:#c0cce0;padding:27px 5px 12px;font-size:16px}.rail button:before{content:'';width:8px;height:8px;border-radius:50%;background:#6b7b9a;position:absolute;top:-5px;left:calc(50% - 4px);transition:.25s}.rail button[aria-pressed=true]{color:var(--yellow)}.rail button[aria-pressed=true]:before{background:var(--yellow);box-shadow:0 0 0 6px #ffd34f20}.rail small{display:block;font-size:9px;margin-top:5px;opacity:.7}.after{display:flex;justify-content:space-between;align-items:center;padding:35px 6%;background:#f8faf9;gap:25px}.after h2{font-size:25px;margin:0 0 8px;letter-spacing:-.6px}.after p{color:var(--muted);margin:0;font-size:14px}.badge{padding:14px 22px;border-radius:30px;background:var(--yellow);font-weight:bold;font-size:13px;white-space:nowrap}footer{max-width:1240px;margin:auto;padding:25px 40px 35px;color:var(--muted);font-size:11px;line-height:1.7}details{margin-top:10px}summary{cursor:pointer;color:var(--ink)}@keyframes drift{to{transform:translate(-120px,100px)}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(min-width:1450px){.intro{padding-top:90px}}@media(max-width:900px){.story-layout{grid-template-columns:220px 1fr;gap:30px}.event-card{grid-template-columns:1fr;gap:18px}.date{font-size:32px}.stage{padding:35px}.slide{gap:30px}.giant{letter-spacing:-6px}.intro{align-items:start}.intro p{max-width:240px}}@media(max-width:650px){.demo{flex-direction:column;align-items:stretch;padding:12px 20px}.demo>span{text-align:center}.choices button{flex:1;padding:10px}.brandbar{padding:20px}.crumb{font-size:11px}.intro{display:block;padding:45px 24px 35px}.intro p{max-width:100%;margin-top:24px;font-size:14px}h1{letter-spacing:-1.5px}.v1{padding:30px 24px}.story-layout{display:block}.story-aside{position:static;padding-top:0}.story-aside h2{font-size:26px}.story-aside p,.years-big,.range,.mini-track{display:none}.events{padding-left:27px}.events:before,.events:after{left:3px}.event:before{left:-29px}.event-card{padding:24px;gap:15px}.event h3{font-size:20px}.v2{padding:0 16px 40px}.stage{padding:27px 22px 20px;border-radius:20px}.slide{grid-template-columns:1fr;gap:26px;padding:15px 0 20px;min-height:510px;align-content:start}.year-art{min-height:185px}.year-art:before,.year-art:after{width:155px;height:155px}.giant{font-size:104px}.slide-copy h2{font-size:28px}.slide-copy p{font-size:14px}.controls{padding-bottom:25px}.controls p{font-size:10px}.rail button{font-size:12px;padding:20px 0 7px}.rail small{font-size:8px}.after{display:block;padding:30px 24px}.badge{display:inline-block;margin-top:20px}footer{padding:22px 24px}.stage-top{font-size:10px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}

.v2{padding:0;max-width:1240px}.v2 .stage{border-radius:0}@media(max-width:650px){.v2{padding:0}.v2 .stage{border-radius:0}}

/* Milestone accents echo the supplied Phoenix CU timeline. */
.event{--milestone:#82c78b;--milestone-dark:#397b43;--milestone-tint:#82c78b20}
.event:nth-child(2),.event:nth-child(6){--milestone:#2cb8b0;--milestone-dark:#087e78;--milestone-tint:#2cb8b020}
.event:nth-child(3),.event:nth-child(7){--milestone:#5395cb;--milestone-dark:#2c6b9f;--milestone-tint:#5395cb20}
.event:nth-child(4){--milestone:#f2a38f;--milestone-dark:#a95440;--milestone-tint:#f2a38f22}
.event-card{border-left:5px solid var(--milestone);background:#fff}
.event .date{color:var(--milestone-dark)}
.event small{color:var(--milestone-dark)}
.event:before,.event.seen:before,.event:last-child:before{background:var(--milestone);box-shadow:0 0 0 4px var(--milestone-tint);border-color:#f4f8f7}
.event.seen:before{box-shadow:0 0 0 6px var(--milestone-tint)}
.event:last-child .event-card{border-left-color:var(--milestone);background:var(--navy)}
.event:last-child .date,.event:last-child small{color:#94c8f0}


/* Solid surfaces and stronger milestone markers. */
.event:before,.event.seen:before,.event:last-child:before{width:20px;height:20px;left:-41px;top:20px;border:3px solid #fff;background:var(--milestone);box-shadow:0 0 0 2px var(--milestone)}
@media(max-width:650px){.event:before,.event.seen:before,.event:last-child:before{left:-33px}}
</style></head><body>
<main><section class="variant v1" id="one" aria-label="Vertical timeline"><div class="story-layout"><aside class="story-aside"><span class="eyebrow">Our story</span><h2>Growing together.<br>Through generations.</h2><p>A story shaped by local people, shared ambition and the strength of coming together.</p><div class="range"><b>1962</b><span>Our journey</span><b>2026</b></div><div class="mini-track"><i></i></div><div class="years-big" aria-hidden="true">60+</div></aside><div class="events"></div></div></section></main>
<script>

// Draft editorial copy: replace with approved source text before publication.
const milestones=[
{year:'1962',tag:'The beginning',title:'Small beginnings. A shared belief.',text:'Our story begins with the establishment of a local credit union — built around a simple idea: people helping people.'},
{year:'1970',tag:'Local roots',title:'A community takes shape.',text:'The establishment of a local credit union in Castleknock adds another chapter to the community roots that would become part of our story.'},
{year:'1984',tag:'Growing locally',title:'More neighbours. More possibilities.',text:'Another local credit union is established, continuing a tradition of accessible financial services and support within the community.'},
{year:'2010',tag:'Coming together',title:'Stronger, together.',text:'A merger brings local credit unions together, combining their experience and strengthening the services available to members.'},
{year:'2015',tag:'A wider community',title:'New connections. Shared values.',text:'A further merger expands the organisation’s presence across Dublin, bringing more communities into the same member-focused family.'},
{year:'2025',tag:'Shared heritage',title:'Our histories become one.',text:'Further mergers bring together organisations with roots reaching back through decades of local service — shaping the foundations of Phoenix Credit Union.'},
{year:'2026',tag:'The next chapter',title:'A new name. The same community spirit.',text:'The Phoenix story enters a new chapter, carrying forward a shared heritage and a continuing commitment to members and community.'}
];
const events=document.querySelector('.events');events.innerHTML=milestones.map((m,i)=>`<article class="event"><div class="event-card"><div><div class="date">${m.year}</div><small>Chapter 0${i+1}</small></div><div><h3>${m.title}</h3><p>${m.text}</p></div></div></article>`).join('');
const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('seen')}),{threshold:.25});document.querySelectorAll('.event').forEach(e=>observer.observe(e));
function updateProgress(){if(document.querySelector('#one').hidden)return;const r=events.getBoundingClientRect();const p=Math.max(0,Math.min(1,(innerHeight*.65-r.top)/(r.height-110)));events.style.setProperty('--p',p);document.documentElement.style.setProperty('--progress',`${p*100}%`)}let ticking=false;addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(()=>{updateProgress();ticking=false});ticking=true}},{passive:true});addEventListener('resize',updateProgress);updateProgress();

</script>
</body></html>
