<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maynooth — porównanie gradientów</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui;color:#203129;background:#f7f6f0}header{min-height:70px;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:16px;margin:0 auto 0 0}button,a{font:inherit;color:inherit}button{padding:9px 14px;border:1px solid #20312940;border-radius:6px;cursor:pointer;background:white}button[aria-pressed=true]{background:#203129;color:white}iframe{display:block;width:100%;height:calc(100dvh - 90px);border:0;background:white}</style><header><h1>Maynooth · Hero gradient</h1><button data-src="index.html" aria-pressed="false">A — Obecny</button><button data-src="home-gradient.html" aria-pressed="true">B — Moving gradient (Figma)</button><a id="open" href="home-gradient.html" target="_blank" rel="noopener">Otwórz osobno ↗</a></header><iframe src="home-gradient.html" title="Podgląd strony głównej"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.src=b.dataset.src;document.querySelector('#open').href=b.dataset.src}));</script></html>
