<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Maynooth · Decarbonising Zone</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#e6eadf;color:#203129}#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}#viewport.dragging{cursor:grabbing}#map{position:absolute;width:10000px;height:5625px;transform-origin:0 0;will-change:transform}#preview{position:absolute;width:100%;height:100%;display:block;pointer-events:none}.tile{position:absolute;width:2000px;height:1875px;display:block;pointer-events:none;opacity:0}.tile.ready{opacity:1}.panel{position:fixed;z-index:2;background:rgba(255,255,255,.94);box-shadow:0 3px 20px #20312915;border:1px solid #ffffff90;border-radius:15px}.title{top:20px;left:20px;padding:16px 20px;pointer-events:none}.title strong{display:block;font-size:18px}.title span{display:block;font-size:12px;color:#6b786d;margin-top:6px}.controls{top:20px;right:20px;display:flex;align-items:center;padding:5px;gap:3px}button{border:0;background:transparent;border-radius:10px;color:inherit;min-width:40px;height:40px;font-size:22px;cursor:pointer}button:hover{background:#edf1e8}button:disabled{opacity:.3;cursor:default}#fit{font-size:12px;padding:0 12px}#zoom{min-width:55px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}.help{bottom:16px;left:20px;padding:10px 14px;font-size:12px;color:#607064;pointer-events:none}#error{display:none;bottom:16px;right:20px;max-width:310px;padding:12px;font-size:12px;background:#fff3db}@media(max-width:650px){.title{top:12px;left:12px;padding:12px}.title strong{font-size:14px}.title span{display:none}.controls{top:66px;right:12px}.help{left:12px;bottom:12px;font-size:11px}}
</style></head><body>
<main id="viewport" aria-label="Interactive Maynooth map"><div id="map"><img id="preview" src="MapJPG-assets/FinalMapDZbasepreview.jpg" alt="Maynooth Decarbonising Zone illustrated map" draggable="false"></div></main>
<div class="panel title"><strong>Maynooth · Decarbonising Zone</strong><span>Drag to explore · Scroll to zoom</span></div>
<nav class="panel controls" aria-label="Map zoom"><button id="minus" aria-label="Zoom out">−</button><output id="zoom">100%</output><button id="plus" aria-label="Zoom in">+</button><button id="fit" title="Fit map (0)">Fit map</button></nav>
<div class="panel help">Scroll / pinch to zoom · Drag to pan · Maximum 400%</div><div class="panel" id="error" role="status">Some detailed tiles could not load. Keep the MapJPG-assets folder next to MapJPG.html, then reload.</div>
<script>
(()=>{'use strict';
const W=10000,H=5625,v=document.getElementById('viewport'),map=document.getElementById('map'),label=document.getElementById('zoom'),minus=document.getElementById('minus'),plus=document.getElementById('plus');
let fit=1,z=1,x=0,y=0,raf=0;const tiles=[],pointers=new Map();
for(let r=0;r<3;r++)for(let c=0;c<5;c++){const img=new Image();img.className='tile';img.style.left=c*2000+'px';img.style.top=r*1875+'px';img.alt='';img.draggable=false;img.decoding='async';img.onload=()=>img.classList.add('ready');img.onerror=()=>{img.dataset.loading='';document.getElementById('error').style.display='block'};map.appendChild(img);tiles.push({img,r,c});}
function clamp(){const s=fit*z,mw=W*s,mh=H*s;x=mw<=v.clientWidth?(v.clientWidth-mw)/2:Math.min(0,Math.max(v.clientWidth-mw,x));y=mh<=v.clientHeight?(v.clientHeight-mh)/2:Math.min(0,Math.max(v.clientHeight-mh,y));}
function render(){raf=0;clamp();const s=fit*z;map.style.transform=`translate(${x}px,${y}px) scale(${s})`;label.value=label.textContent=Math.round(z*100)+'%';minus.disabled=z<=1;plus.disabled=z>=4;if(z>1.01){const l=-x/s,t=-y/s,r=(v.clientWidth-x)/s,b=(v.clientHeight-y)/s;for(const a of tiles){if((a.c+1)*2000>=l-500&&a.c*2000<=r+500&&(a.r+1)*1875>=t-500&&a.r*1875<=b+500&&!a.img.dataset.loading){a.img.dataset.loading='1';a.img.src=`MapJPG-assets/tiles/tile-${a.r+1}-${a.c+1}.jpg`;}}}}
function draw(){if(!raf)raf=requestAnimationFrame(render)}
function zoom(n,cx=v.clientWidth/2,cy=v.clientHeight/2){n=Math.max(1,Math.min(4,n));const ratio=n/z;x=cx-(cx-x)*ratio;y=cy-(cy-y)*ratio;z=n;draw()}
function reset(){fit=Math.min(v.clientWidth/W,v.clientHeight/H);z=1;x=(v.clientWidth-W*fit)/2;y=(v.clientHeight-H*fit)/2;draw()}
plus.onclick=()=>zoom(z*1.25);minus.onclick=()=>zoom(z/1.25);document.getElementById('fit').onclick=reset;
v.addEventListener('wheel',e=>{e.preventDefault();zoom(z*Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
v.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;v.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});v.classList.add('dragging')});
v.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=[...pointers.values()];const previous=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const cur=[...pointers.values()];if(cur.length===1){x+=e.clientX-previous.x;y+=e.clientY-previous.y;draw()}else if(cur.length===2){const od=Math.hypot(old[0].x-old[1].x,old[0].y-old[1].y),nd=Math.hypot(cur[0].x-cur[1].x,cur[0].y-cur[1].y),ox=(old[0].x+old[1].x)/2,oy=(old[0].y+old[1].y)/2,nx=(cur[0].x+cur[1].x)/2,ny=(cur[0].y+cur[1].y)/2;zoom(z*nd/Math.max(1,od),ox,oy);x+=nx-ox;y+=ny-oy;draw()}});
function end(e){pointers.delete(e.pointerId);if(!pointers.size)v.classList.remove('dragging')}
v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);v.addEventListener('lostpointercapture',end);v.addEventListener('dblclick',e=>zoom(z<4?z*1.5:1,e.clientX,e.clientY));
window.addEventListener('keydown',e=>{if(['+','=','-','0','Home','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.key==='+'||e.key==='=')zoom(z*1.25);if(e.key==='-')zoom(z/1.25);if(e.key==='0'||e.key==='Home')reset();if(e.key==='ArrowLeft')x+=80;if(e.key==='ArrowRight')x-=80;if(e.key==='ArrowUp')y+=80;if(e.key==='ArrowDown')y-=80;draw()});
window.addEventListener('resize',()=>{const old=fit;fit=Math.min(v.clientWidth/W,v.clientHeight/H);const ratio=fit/old;x=v.clientWidth/2-(v.clientWidth/2-x)*ratio;y=v.clientHeight/2-(v.clientHeight/2-y)*ratio;draw()});reset();
})();
</script></body></html>
