<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maynooth DZ — mapa</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#34483d;background:#e4e8dd}button{font:inherit;color:inherit;cursor:pointer}#map{position:absolute;inset:0;outline:none;touch-action:none;cursor:grab}#map:active{cursor:grabbing}#map:focus-visible{outline:3px solid #526c54;outline-offset:-3px}canvas{display:block;width:100%;height:100%}.panel{position:absolute;background:rgba(255,255,250,.94);border:1px solid rgba(60,77,61,.13);box-shadow:0 4px 24px #233c2010;backdrop-filter:blur(12px);border-radius:14px}.title{top:24px;left:24px;padding:16px 22px;pointer-events:none}.title h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.35px}.title p{font-size:12px;color:#718071;margin:5px 0 0}.tools{right:24px;top:24px;display:flex;align-items:center;gap:3px;padding:5px}.tools button{border:0;background:transparent;border-radius:10px;height:42px;min-width:42px;transition:background .15s}.tools button:hover{background:#e8eee2}.tools button:focus-visible{outline:2px solid #52724e;outline-offset:-2px}.tools button:disabled{opacity:.3;cursor:default}#minus,#plus{font-size:23px;font-weight:300}#reset{font-size:14px;min-width:72px;font-variant-numeric:tabular-nums}#fullscreen{border-left:1px solid #dfe5d9;border-radius:0 10px 10px 0;font-size:22px}.hint{bottom:20px;left:50%;transform:translateX(-50%);padding:9px 15px;font-size:12px;white-space:nowrap;pointer-events:none;color:#62715f}#status{position:absolute;bottom:65px;left:50%;transform:translateX(-50%);font-size:12px;color:#425740;background:#fffffff2;border-radius:20px;padding:8px 14px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90%;text-align:center}#status.visible{opacity:1}.credit{position:absolute;left:16px;bottom:12px;font-size:10px;color:#60705e;pointer-events:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:760px){.title{top:12px;left:12px;padding:12px 15px}.title h1{font-size:15px}.title p{font-size:11px}.tools{top:auto;bottom:24px;right:50%;transform:translateX(50%)}.hint{display:none}.credit{bottom:5px;font-size:9px}#status{bottom:88px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" tabindex="0" role="region" aria-label="Mapa Maynooth. Przybliżanie kółkiem myszy, przeciąganie, klawisze plus, minus i strzałki. Zero dopasowuje mapę."><canvas id="canvas" aria-hidden="true"></canvas></div>
<header class="panel title"><h1>Maynooth · Decarbonising Zone</h1><p>Odkrywaj mapę i jej miejsca</p></header>
<nav class="panel tools" aria-label="Sterowanie mapą"><button id="minus" aria-label="Oddal mapę">−</button><button id="reset" title="Dopasuj całą mapę" aria-label="Dopasuj całą mapę">100%</button><button id="plus" aria-label="Przybliż mapę">+</button><button id="fullscreen" title="Pełny ekran" aria-label="Pełny ekran">⛶</button></nav>
<div class="panel hint">Przeciągnij mapę · przybliż kółkiem myszy · dwuklik, aby przybliżyć</div>
<div id="status" role="status" aria-live="polite">Wczytywanie mapy…</div>
<div class="credit">© OpenStreetMap contributors · mapa ilustracyjna</div>
<script>
'use strict';
const MW=10128,MH=5700,COLS=4,ROWS=3,TW=2532,TH=1900,MIN_ZOOM=1,MAX_ZOOM=4;
const map=document.querySelector('#map'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d',{alpha:false});
const status=document.querySelector('#status'),plus=document.querySelector('#plus'),minus=document.querySelector('#minus'),reset=document.querySelector('#reset');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,fit=1,zoom=1,x=0,y=0,target={zoom:1,x:0,y:0},frame=0,previous=0,active=0,failed=false;
const pointers=new Map();let gesture=null;
const tiles=Array.from({length:12},(_,i)=>({i,col:i%4,row:Math.floor(i/4),image:null,state:'idle',shown:0}));
const preview=new Image();preview.decoding='async';preview.fetchPriority='high';
function message(text){status.textContent=text;status.classList.toggle('visible',!!text)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function constrain(t){const s=fit*t.zoom,w=MW*s,h=MH*s;t.x=w<=W?(W-w)/2:clamp(t.x,W-w,0);t.y=h<=H?(H-h)/2:clamp(t.y,H-h,0);return t}
function tick(){if(!frame)frame=requestAnimationFrame(draw)}
function resize(){const oldFit=fit,cx=W?((W/2-x)/(oldFit*zoom)):MW/2,cy=H?((H/2-y)/(oldFit*zoom)):MH/2;W=map.clientWidth;H=map.clientHeight;DPR=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);fit=Math.min(W/MW,H/MH);target=constrain({zoom,x:W/2-cx*fit*zoom,y:H/2-cy*fit*zoom});x=target.x;y=target.y;tick()}
function visibility(t,margin=0,v={zoom,x,y}){const s=fit*v.zoom,l=v.x+t.col*TW*s,top=v.y+t.row*TH*s;return l<W+margin&&l+TW*s>-margin&&top<H+margin&&top+TH*s>-margin}
function pump(){if(target.zoom<=1.05)return;const candidates=tiles.filter(t=>t.state==='idle'&&visibility(t,0,target)).sort((a,b)=>{const s=fit*zoom;return Math.hypot(x+(a.col+.5)*TW*s-W/2,y+(a.row+.5)*TH*s-H/2)-Math.hypot(x+(b.col+.5)*TW*s-W/2,y+(b.row+.5)*TH*s-H/2)});while(active<3&&candidates.length)loadTile(candidates.shift())}
function loadTile(t){t.state='loading';active++;const im=new Image();im.decoding='async';im.onload=async()=>{try{await im.decode()}catch(e){}t.image=im;t.state='ready';t.shown=performance.now();active--;tick();pump()};im.onerror=()=>{t.state='error';active--;failed=true;tick();pump()};im.src=`MapJPG-assets/Maynooth-${String(t.i+1).padStart(2,'0')}-R${t.row+1}-C${t.col+1}.jpg`}
function draw(now){frame=0;const dt=previous?Math.min(now-previous,64):16;previous=now;let moving=false;const f=reduced?1:1-Math.exp(-dt/65);if(Math.abs(target.zoom-zoom)>.0001||Math.abs(target.x-x)>.05||Math.abs(target.y-y)>.05){zoom+=(target.zoom-zoom)*f;x+=(target.x-x)*f;y+=(target.y-y)*f;moving=true}else{zoom=target.zoom;x=target.x;y=target.y}
ctx.fillStyle='#e4e8dd';ctx.fillRect(0,0,canvas.width,canvas.height);const s=fit*zoom*DPR,px=x*DPR,py=y*DPR;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
if(preview.complete&&preview.naturalWidth)ctx.drawImage(preview,px,py,MW*s,MH*s);
let fading=false;if(zoom>1.05){for(const t of tiles){if(t.state!=='ready'||!visibility(t))continue;const a=reduced?1:clamp((now-t.shown)/220,0,1);fading||=a<1;ctx.globalAlpha=a;const l=Math.round(px+t.col*TW*s),r=Math.round(px+(t.col+1)*TW*s),top=Math.round(py+t.row*TH*s),bottom=Math.round(py+(t.row+1)*TH*s);ctx.drawImage(t.image,l,top,r-l,bottom-top)}ctx.globalAlpha=1;pump()}
reset.textContent=Math.round(zoom*100)+'%';minus.disabled=target.zoom<=MIN_ZOOM+.001;plus.disabled=target.zoom>=MAX_ZOOM-.001;
if(preview.naturalWidth){const waiting=zoom>1.05&&tiles.some(t=>visibility(t)&&['loading','idle'].includes(t.state));message(waiting?'Wczytywanie szczegółów…':failed&&zoom>1.05?'Nie udało się wczytać części szczegółów. Sprawdź folder MapJPG-assets.':'')}
if(moving||fading)tick();else previous=0}
function zoomAt(value,ax=W/2,ay=H/2,animate=true){value=clamp(value,MIN_ZOOM,MAX_ZOOM);const ratio=value/target.zoom;target=constrain({zoom:value,x:ax-(ax-target.x)*ratio,y:ay-(ay-target.y)*ratio});if(!animate){zoom=target.zoom;x=target.x;y=target.y}tick()}
function home(){target=constrain({zoom:1,x:0,y:0});tick()}
function freeze(){target={zoom,x,y}}
map.addEventListener('wheel',e=>{e.preventDefault();const r=map.getBoundingClientRect(),delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?H:1);zoomAt(target.zoom*Math.exp(-delta*.0018),e.clientX-r.left,e.clientY-r.top)},{passive:false});
map.addEventListener('dblclick',e=>{const r=map.getBoundingClientRect();zoomAt(target.zoom>=MAX_ZOOM-.01?1:target.zoom*1.4,e.clientX-r.left,e.clientY-r.top)});
function point(e){const r=map.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function snapshot(){const a=[...pointers.values()];if(a.length>=2){const A=a[0],B=a[1];gesture={mx:(A.x+B.x)/2,my:(A.y+B.y)/2,d:Math.hypot(A.x-B.x,A.y-B.y)}}else gesture=a[0]?{...a[0]}:null}
map.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;freeze();map.focus({preventScroll:true});map.setPointerCapture(e.pointerId);pointers.set(e.pointerId,point(e));snapshot()});
map.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,point(e));const a=[...pointers.values()];if(a.length>=2){const A=a[0],B=a[1],mx=(A.x+B.x)/2,my=(A.y+B.y)/2,d=Math.hypot(A.x-B.x,A.y-B.y);if(gesture&&gesture.d){const nz=clamp(zoom*d/gesture.d,MIN_ZOOM,MAX_ZOOM),ratio=nz/zoom;target=constrain({zoom:nz,x:mx-(gesture.mx-x)*ratio,y:my-(gesture.my-y)*ratio})}}else if(gesture&&gesture.x!==undefined){target=constrain({zoom,x:x+a[0].x-gesture.x,y:y+a[0].y-gesture.y})}zoom=target.zoom;x=target.x;y=target.y;snapshot();tick()});
function up(e){pointers.delete(e.pointerId);snapshot()}map.addEventListener('pointerup',up);map.addEventListener('pointercancel',up);map.addEventListener('lostpointercapture',up);
map.addEventListener('keydown',e=>{if(['+','=','-','0','Home','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.key==='+'||e.key==='=')zoomAt(target.zoom*1.2);if(e.key==='-')zoomAt(target.zoom/1.2);if(e.key==='0'||e.key==='Home')home();const arrows={ArrowLeft:[80,0],ArrowRight:[-80,0],ArrowUp:[0,80],ArrowDown:[0,-80]};if(arrows[e.key]){target=constrain({...target,x:target.x+arrows[e.key][0],y:target.y+arrows[e.key][1]});tick()}});
plus.onclick=()=>zoomAt(target.zoom*1.25);minus.onclick=()=>zoomAt(target.zoom/1.25);reset.onclick=home;
const full=document.querySelector('#fullscreen');if(!document.fullscreenEnabled)full.hidden=true;full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){message('Pełny ekran nie jest dostępny w tej przeglądarce.')}};
preview.onload=()=>{message('');tick()};preview.onerror=()=>message('Nie można otworzyć mapy. Rozpakuj cały ZIP i zachowaj folder MapJPG-assets obok MapJPG.html.');message('Wczytywanie mapy…');preview.src='MapJPG-assets/Maynooth-12-preview.jpg';new ResizeObserver(resize).observe(map);resize();
</script>
</body></html>
